            <div class="container">

    <!-- Upload Section 1 -->
                <div class="card">
                    <div class="file-section">
                        <button class="btn btn-hash" onclick="selectFile(1)">Subir archivo 1</button>
                        <span class="file-name" id="fileName1">No file selected</span>

                        <input type="file" id="fileInput1" style="display:none" onchange="handleFile(1)">
                    </div>
                </div>

                <!-- Upload Section 2 -->
                <div class="card">
                    <div class="file-section">
                        <button class="btn btn-hash" onclick="selectFile(2)">Subir archivo 2</button>
                        <span class="file-name" id="fileName2">No file selected</span>

                        <input type="file" id="fileInput2" style="display:none" onchange="handleFile(2)">
                    </div>
                </div>

            </div>

            <div class="container">
                <!-- Format Section -->
                <div class="card small" id="select-hashes">
                    <span class="hash-text">Elige el formato del hash</span>
                    <div class="btn-group" role="group" aria-label="Format selector">
                        <input type="radio" class="btn-check" name="hashFormat" id="sha384" autocomplete="off" checked>
                        <label class="btn btn-outline-light" for="sha384">SHA-384</label>

                        <input type="radio" class="btn-check" name="hashFormat" id="sha1" autocomplete="off">
                        <label class="btn btn-outline-light" for="sha1">SHA-1</label>

                        <input type="radio" class="btn-check" name="hashFormat" id="sha256" autocomplete="off">
                        <label class="btn btn-outline-light" for="sha256">SHA-256</label>

                        <input type="radio" class="btn-check" name="hashFormat" id="sha512" autocomplete="off">
                        <label class="btn btn-outline-light" for="sha512">SHA-512</label>

                        <input type="radio" class="btn-check" name="hashFormat" id="bcrypt" autocomplete="off">
                        <label class="btn btn-outline-light" for="bcrypt">bcrypt</label>
                    </div>
                </div>


                <!-- Calculate Section -->
                <div class="card large">
                    <button class="btn big" onclick="calculateHashes()" id="master-btn">Calcular hashes</button>
                </div>

                <!-- Hashes en sí -->
                 <div class="hash-placeholder-card">
                     <div class="file-section">
                     <div class="file-card" >
                         <h3 id="hash-placeholder1">Archivo 1</h3>
                         <div class="hash-placeholder" id="color1"><span id="hashOutput1"></span></div>
                     </div>
                     <div class="file-card" >
                         <h3 id="hash-placeholder2">Archivo 2</h3>
                         <div class="hash-placeholder" id="color2"><span id="hashOutput2"></span></div>
                     </div>
                     </div>
                 </div>

            </div>
            </div>

                    ¿Seguro que quieres cerrar sesión?

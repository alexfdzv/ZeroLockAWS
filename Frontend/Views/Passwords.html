<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwords - ZeroLock</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS Custom -->
    <link rel="stylesheet" href="../Assets/Passwords.css">
</head>
<body>
<header>
    <!-- NAV BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./Profile.html">
                <img src="../Assets/Logo_ZeroLock.jpeg" alt="ZeroLock Logo" class="navbar-logo" />
                <span class="navbar-title">ZeroLock</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mynavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item me-3">
                        <a class="nav-link active" href="./Passwords.html">
                            <span class="glow-text">Contraseñas</span>
                        </a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link active" href="./Notes.html">
                            <span class="glow-text">Notas</span>
                        </a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link active" href="./Stego.html">
                            <span class="glow-text">Stego</span>
                        </a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link active" href="./Hashes.html">
                            <span class="glow-text">Comparador de hashes</span>
                        </a>
                    </li>
                </ul>

                <!-- Botón logout -->
                <button type="button" class="btn navbar-logout-btn" data-bs-toggle="modal" data-bs-target="#modalLogout" title="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>
    <!-- NAV BAR -->
</header>

<!-- Main Content -->
<main>
    <!-- Search Bar -->
    <div class="search-container">
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Buscar tarjetas o contraseñas..." id="searchInput">
        </div>
    </div>

    <!-- Accordion -->
    <div class="accordion" id="mainAccordion">
        <!-- ==================== TARJETAS BANCARIAS ==================== -->
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCards">
                    <i class="fas fa-credit-card me-2"></i> Tarjetas Bancarias
                    <span class="badge bg-primary ms-2" id="cardsBadge">0</span>
                </button>
            </h2>
            <div id="collapseCards" class="accordion-collapse collapse show">
                <div class="accordion-body">
                    <div class="row g-3" id="cardsContainer">
                        <!-- Las tarjetas se cargarán dinámicamente desde JavaScript -->
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== CONTRASEÑAS ==================== -->
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePasswords">
                    <i class="fas fa-globe me-2"></i> Contraseñas de Sitios Web
                    <span class="badge bg-secondary ms-2" id="passwordsBadge">0</span>
                </button>
            </h2>
            <div id="collapsePasswords" class="accordion-collapse collapse">
                <div class="accordion-body">
                    <div class="row g-3" id="passwordsContainer">
                        <!-- Las contraseñas se cargarán dinámicamente desde JavaScript -->
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-secondary" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- ==================== FLOATING ACTION BUTTONS ==================== -->
<div class="fab-container">
    <button class="fab-btn fab-card" data-tooltip="Agregar Tarjeta" data-bs-toggle="modal" data-bs-target="#addCardModal">
        <i class="fas fa-credit-card"></i>
    </button>
    <button class="fab-btn fab-password" data-tooltip="Agregar Contraseña" data-bs-toggle="modal" data-bs-target="#addPasswordModal">
        <i class="fas fa-key"></i>
    </button>
</div>

<!-- ==================== MODAL: AGREGAR TARJETA ==================== -->
<div class="modal fade" id="addCardModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="addCardForm">
            <div class="modal-header">
                <h5 class="modal-title">Agregar Tarjeta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Nombre de la tarjeta</label>
                    <input type="text" class="form-control" id="addCardName" placeholder="Ej: BBVA Platinum" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre del titular</label>
                    <input type="text" class="form-control" id="addCardHolder" placeholder="Juan Pérez" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Número de tarjeta</label>
                    <input type="text" class="form-control" id="addCardNumber" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Vencimiento</label>
                        <input type="text" class="form-control" id="addCardExp" placeholder="MM/AA" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">CVV</label>
                        <input type="text" class="form-control" id="addCardCVV" placeholder="123" maxlength="4" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- ==================== MODAL: AGREGAR CONTRASEÑA ==================== -->
<div class="modal fade" id="addPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="addPasswordForm">
            <div class="modal-header">
                <h5 class="modal-title">Agregar Contraseña</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Sitio</label>
                    <input type="text" class="form-control" id="addPasswordSite" placeholder="Ej: Gmail" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="addPasswordUsername" placeholder="usuario@ejemplo.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="text" class="form-control" id="addPasswordPassword" placeholder="Tu contraseña segura" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">URL (opcional)</label>
                    <input type="url" class="form-control" id="addPasswordUrl" placeholder="https://ejemplo.com">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- ==================== MODAL: LOGOUT ==================== -->
<div class="modal fade" id="modalLogout" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm" style="margin-top: 100px;">
        <div class="modal-content">
            <div class="modal-header border-bottom border-light">
                <h5 class="modal-title" style="color:#b066ff;">Cerrar sesión</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                ¿Seguro que quieres cerrar sesión?
            </div>
            <div class="modal-footer border-top border-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <a href="./Login.html">
                    <button type="button" class="btn btn-primary" style="background:linear-gradient(90deg, #8b5cf6, #b066ff); border:none;">
                        Aceptar
                    </button>
                </a>
            </div>
        </div>
    </div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tema (si lo usas) -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.body.classList.toggle("light-mode", savedTheme === "light");
    });
</script>
<script src="../Controllers/Auth_Fetch.js"></script>
<script src="../Controllers/CryptoFunc.js"></script>
<!-- Controlador principal -->
<script src="../Controllers/Passwords_Controller.js"></script>
</body>
</html>

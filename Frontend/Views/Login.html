<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroLock | Login</title>


  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Iconos -->
  <script src="https://kit.fontawesome.com/5e25872797.js" crossorigin="anonymous"></script>

  <!-- CSS propio -->
  <link rel="stylesheet" href="../Assets/Login.css">

</head>

<body class="d-flex align-items-center justify-content-center vh-100">

  <main>
     <div class="login-card p-4 shadow-lg">
      <div class="text-center mb-4">
        <img src="../Assets/Logo_ZeroLock.jpeg" alt="ZeroLock Logo" class="logo">
        <h2 class="text-gradient mt-2">ZeroLock</h2>
        <p class="">Protege tus datos, protege tu mundo</p>
      </div>

      <!-- LOGIN FORM -->
      <form id="formLogin" action="">
        <div class="mb-3">
          <label for="loginCorreo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" name="correo" id="loginCorreo" placeholder="tucorreo@gmail.com" required>
        </div>
        <div class="mb-3">
          <label for="loginPswd" class="form-label">Contraseña</label>
          <input type="password" class="form-control" name="pass" id="loginPswd" placeholder="••••••••" required>
        </div>
        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-primary">Iniciar sesión</button>
          <button type="button" class="btn btn-secondary" onclick="toggleForms()">Registrarse</button>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form id="formRegister" style="display: none;">
        <div class="mb-2">
          <label for="registerName" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="registerName" name="nombre" placeholder="usuario_ejemplo00" required>
        </div>
        <div class="mb-2">
          <label for="registerCorreo" class="form-label">Correo</label>
          <input type="email" class="form-control" id="registerCorreo"  name="correo" placeholder="tucorreo@gmail.com" required>
        </div>
        <div class="mb-2">
          <label for="registerpwd" class="form-label">Contraseña</label>
          <input type="password" class="form-control" name="pass" id="registerpwd" placeholder="Mínimo 8 caracteres" required>
        </div>
        <div class="mb-2">
          <label for="registerpwdc" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="registerpwdc" name="confirm_pass" placeholder="••••••••" required>
        </div>
        <div class="d-grid gap-2 mt-3">
          <button type="submit" class="btn btn-primary">Crear cuenta</button>
          <button type="button" class="btn btn-secondary" onclick="toggleForms()">Iniciar sesión</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    © 2025 ZeroLock | Todos los derechos reservados
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/Controllers/Login_Controller_Front.js"></script>

  
</body>
</html>
